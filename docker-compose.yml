services:
  localminidrama:
    build: .
    container_name: localminidrama
    restart: unless-stopped
    ports:
      - "5679:5679"
    volumes:
      # 持久化数据库与上传文件（本地可访问）
      - ./data:/app/backend-node/data
      # 可挂载自定义配置（含 AI API Key）
      - ./backend-node/configs/config.yaml:/app/backend-node/configs/config.yaml:ro
      - ./frontweb/dist:/app/frontweb/dist
    environment:
      - TZ=Asia/Shanghai
    # 如需监听 host 变化可在 compose watch 中使用
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./backend-node/src
    #       target: /app/backend-node/src
    #
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - localminidrama
